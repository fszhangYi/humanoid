# 自有策略 · 部署对齐配置（训完导出后可改 policy_path）
# 结构对齐 unitree_rl_gym deploy g1.yaml，便于以后接到 MuJoCo 推理。

policy_path: "my_party/policies/my_policy.pt"
xml_path: "models/unitree_g1_12dof/scene.xml"

simulation_duration: 60.0
simulation_dt: 0.002
control_decimation: 10

kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0,
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47

cmd_init: [0.5, 0, 0]
